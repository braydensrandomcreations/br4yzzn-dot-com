<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>br4yzzn dot com - official website</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap');

body
{
  background-image: linear-gradient(#001a4d, #9bd8ff);
  background-attachment: fixed;
  margin: 0;
  text-align: center;
  font-family: "Inter", sans-serif;
  color: white;
}

.heading
{
  display: inline-block;
  animation: fadeRise 0.7s ease-out both;
}

.subText
{
  display: block;
  animation: fadeIn 0.9s 0.25s ease-out both;
}

.divider
{
  width: 180px;
  height: 1px;
  border: 0;
  margin: 14px auto 16px;
  background: rgba(255, 255, 255, 0.45);
  animation: fadeIn 0.9s 0.4s ease-out both;
}

.buttonsDiv
{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.buttonsDoohick
{
  font-family: "Inter", sans-serif;
}

.buttonsDoohick:hover
{
  transition: transform 0.3s ease;
  transform: translateY(-1px);
}

@keyframes fadeRise
{
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

@keyframes fadeIn
{
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>
<body>
<h1 class="heading">br4yzzn dot com</h1>
<small class="subText">web ports</small>
<hr class="divider">
<div class="buttonsDiv">
  <button class="buttonsDoohick" onclick="window.location.href='ports.html'">all of my public web ports</button>
</div>
</body>
</html>
